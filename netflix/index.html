<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Movie Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

 
</head>

<body >
    <div id="root" class="glass w-full max-w-[1600px] rounded-2xl shadow-xl overflow-auto no-scrollbar h-full">
        
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('mf-widget-GYzEOjYdHwdETKoGkWVsA');
        if (container && typeof MFWidget !== 'undefined') {
            MFWidget.init({
                containerId: 'mf-widget-GYzEOjYdHwdETKoGkWVsA',
                assetType: 'movie',
                assetId: 'GYzEOjYdHwdETKoGkWVsA'
            });
        } else {
            console.error('MFWidget or container not found.');
            container.querySelector('.mw-powered-by').style.display = 'none';
        }
    });
</script>
<script src="https://cdn.moviefone.com/widgets/mf-widget.min.js" defer></script>

</body>

</html>
