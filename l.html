<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Login - Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body class="min-h-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('https://assets.aboutamazon.com/dims4/default/d634820/2147483647/strip/true/crop/1279x720+0+0/resize/1320x743!/quality/90/?url=https%3A%2F%2Famazon-blogs-brightspot.s3.amazonaws.com%2F58%2F75%2Fa9ac0af245d0a4267feb6f361781%2Fpv-v-day-movies.jpg');">

  <div class="relative w-full max-w-md p-8 bg-black/40 rounded-xl shadow-xl backdrop-blur-md border border-black/40 text-white">
    <!-- Decorative Shapes -->
    <div class="absolute -top-20 -left-20 w-52 h-52 bg-gradient-to-br from-blue-700 to-blue-400 rounded-full z-0 opacity-70 blur-2xl"></div>
    <div class="absolute -bottom-24 -right-10 w-52 h-52 bg-gradient-to-r from-orange-400 to-red-500 rounded-full z-0 opacity-60 blur-2xl"></div>

    <div class="relative z-10">
      <h2 class="text-4xl font-semibold text-center mb-6">Welcome Back</h2>

      <form>
        <div class="mb-4">
          <label for="username" class="block mb-1 text-md font-medium">Username</label>
          <input type="text" id="username" placeholder="Email or Phone"
            class="w-full px-4 py-2 rounded-md bg-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
        </div>

        <div class="mb-6">
          <label for="password" class="block mb-1 text-md font-medium">Password</label>
          <input type="password" id="password" placeholder="Password"
            class="w-full px-4 py-2 rounded-md bg-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-blue-300 transition" />
        </div>

        <button type="submit"
          class="w-full py-3 rounded-md bg-white text-black font-semibold hover:bg-blue-500 hover:text-white transition duration-300">Log
          In</button>
      </form>

      <div class="mt-6 flex justify-between space-x-4">
        <button
          class="flex-1 flex items-center justify-center gap-2 py-2 rounded-md bg-red-600 hover:bg-red-700 transition text-white text-sm font-medium">
          <i class="fab fa-google"></i> Google
        </button>
        <button
          class="flex-1 flex items-center justify-center gap-2 py-2 rounded-md bg-blue-600 hover:bg-blue-700 transition text-white text-sm font-medium">
          <i class="fab fa-facebook-f"></i> Facebook
        </button>
      </div>
    </div>
  </div>
  <div id="mf-widget-GYzEOjYdHwdETKoGkWVsA"><a class='mw-powered-by' style='width: calc(100% - 10px);display: block;padding: 8px 0 8px 10px;font-size: 11px;border-radius: 4px 4px 0 0;background: #f5f5f5;color: #464646;text-align: left;text-decoration: none;font-family: Arial, sans-serif;' href='https://www.moviefone.com' target='_blank'>powered by Moviefone</a></div>
<script src="https://cdn.moviefone.com/widgets/mf-widget.min.js" defer></script>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('mf-widget-GYzEOjYdHwdETKoGkWVsA');
        if (container && typeof MFWidget !== 'undefined') {
            MFWidget.init({
                containerId: 'mf-widget-GYzEOjYdHwdETKoGkWVsA',
                assetType: 'movie',
                assetId: 'GYzEOjYdHwdETKoGkWVsA'
            });
        } else {
            console.error('MFWidget or container not found.');
            container.querySelector('.mw-powered-by').style.display = 'none';
        }
    });
</script>

</body>
</html>
